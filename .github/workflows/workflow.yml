name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A061E3: ${{ secrets.A061E3 }}
          B6A83A: ${{ secrets.B6A83A }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A061E3', '')
          k2 = os.environ.get('B6A83A', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- a727ca0fad9f8f3d8d01078052a3a0cf -->', k1) if k1 else txt
          out = out.replace('<!-- 5d24476b403bb77016d137979beb1ed1b613 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
